name: Deploy site

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HEALTHCHECK_EXPECTED_TEXT: ${{ vars.HEALTHCHECK_EXPECTED_TEXT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies and build site
        run: |
          python -m pip install -r requirements.txt
          python -m mkdocs build --strict

      - name: Upload site files for REG.RU
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: bash .github/scripts/check-site.sh "$SITE_URL"

  deploy-regru:
    needs: deploy-pages
    runs-on: ubuntu-latest
    env:
      DEPLOY_DOMAIN: aleldm.online
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-files
          path: site

      - name: Copy site via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          source: "site/**"
          target: "/var/www/${{ secrets.DEPLOY_USER }}/data/www/${{ env.DEPLOY_DOMAIN }}"
          strip_components: 1

      - name: Check published site
        env:
          SITE_URL: https://${{ env.DEPLOY_DOMAIN }}/
        run: bash .github/scripts/check-site.sh "$SITE_URL"
