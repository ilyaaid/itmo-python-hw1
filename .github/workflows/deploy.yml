name: Deploy site

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'aleldm-production' || format('site-deploy-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  DEPLOY_DOMAIN: aleldm.online
  HEALTHCHECK_EXPECTED_TEXT: ${{ vars.HEALTHCHECK_EXPECTED_TEXT }}

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      is_main: ${{ steps.destination.outputs.is_main }}
      site_host: ${{ steps.destination.outputs.site_host }}
    steps:
      - name: Require main for manual launch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Select main in the Run workflow branch menu.'
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve deploy destination
        id: destination
        shell: bash
        run: |
          site_host=$(bash .github/scripts/site-host.sh "$GITHUB_REF_NAME" "$DEPLOY_DOMAIN")
          if [[ "$site_host" == "$DEPLOY_DOMAIN" ]]; then
            echo 'is_main=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_main=false' >> "$GITHUB_OUTPUT"
          fi
          printf 'site_host=%s\n' "$site_host" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies and build site
        run: |
          python -m pip install -r requirements.txt
          python -m mkdocs build --strict

      - name: Upload built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-files
          path: site/
          if-no-files-found: error
          retention-days: 90

      - name: Upload GitHub Pages artifact
        if: steps.destination.outputs.is_main == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy-pages:
    needs: build
    if: needs.build.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start GitHub Pages timer
        run: echo "DEPLOY_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Check published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: bash .github/scripts/check-site.sh "$SITE_URL"

      - name: Report GitHub Pages time
        if: always()
        run: |
          if [[ -z "${DEPLOY_STARTED_MS:-}" ]]; then exit 0; fi
          elapsed_ms=$(( $(date +%s%3N) - DEPLOY_STARTED_MS ))
          printf '### GitHub Pages\n\nПубликация и healthcheck: %d.%03d с\n' \
            "$((elapsed_ms / 1000))" "$((elapsed_ms % 1000))" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: [build, deploy-pages]
    if: needs.build.outputs.is_main == 'true' && needs.deploy-pages.result == 'success'
    uses: ./.github/workflows/publish-production.yml
    secrets: inherit

  deploy-preview:
    needs: build
    if: needs.build.outputs.is_main == 'false'
    uses: ./.github/workflows/publish-preview.yml
    with:
      site_host: ${{ needs.build.outputs.site_host }}
    secrets: inherit
