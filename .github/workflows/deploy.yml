name: Deploy site

on:
  push:
    branches: ['**']

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DOMAIN: aleldm.online
  HEALTHCHECK_EXPECTED_TEXT: ${{ vars.HEALTHCHECK_EXPECTED_TEXT }}

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      is_main: ${{ steps.destination.outputs.is_main }}
      site_host: ${{ steps.destination.outputs.site_host }}
    steps:
      - name: Resolve deploy destination
        id: destination
        shell: bash
        run: |
          is_main=true
          site_host=$DEPLOY_DOMAIN
          if [[ "$GITHUB_REF_NAME" != main ]]; then
            is_main=false
            export LC_ALL=C
            slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9]+/-/g; s/^-//; s/-$//')
            slug=${slug:0:42}
            slug=${slug%-}
            branch_hash=$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c1-12)
            label="preview-${slug:-branch}-$branch_hash"
            site_host="$label.$DEPLOY_DOMAIN"
          fi
          printf 'is_main=%s\nsite_host=%s\n' "$is_main" "$site_host" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies and build site
        run: |
          python -m pip install -r requirements.txt
          python -m mkdocs build --strict

      - name: Upload site files for REG.RU
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: site/

      - name: Upload GitHub Pages artifact
        if: steps.destination.outputs.is_main == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build
    if: needs.build.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: bash .github/scripts/check-site.sh "$SITE_URL"

  deploy-regru:
    needs: [build, deploy-pages]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (needs.build.outputs.is_main == 'false' || needs.deploy-pages.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-files
          path: site

      - name: Copy site via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          source: "site/**"
          target: "/var/www/${{ secrets.DEPLOY_USER }}/data/www/${{ needs.build.outputs.site_host }}"
          strip_components: 1

      - name: Check published site
        env:
          SITE_URL: https://${{ needs.build.outputs.site_host }}/
        run: |
          bash .github/scripts/check-site.sh "$SITE_URL"
          printf 'Published site: <%s>\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
