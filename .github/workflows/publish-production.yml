name: Publish production files

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DOMAIN: aleldm.online
      HEALTHCHECK_EXPECTED_TEXT: ${{ vars.HEALTHCHECK_EXPECTED_TEXT }}
    steps:
      - uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-files
          path: site

      - name: Start REG.RU timer
        run: echo "DEPLOY_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Prepare upload directory
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          envs: DEPLOY_USER,DEPLOY_DOMAIN
          script: |
            set -eu
            staging="/var/www/$DEPLOY_USER/data/.site-staging/$DEPLOY_DOMAIN"
            mkdir -p "$staging"
            rm -rf -- "$staging/next"

      - name: Copy site via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          source: "site/**"
          target: "/var/www/${{ secrets.DEPLOY_USER }}/data/.site-staging/${{ env.DEPLOY_DOMAIN }}/next"
          strip_components: 1

      - name: Start activation timer
        run: echo "ACTIVATION_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Publish and save previous version
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          envs: DEPLOY_USER,DEPLOY_DOMAIN
          script: |
            set -eu
            site="/var/www/$DEPLOY_USER/data/www/$DEPLOY_DOMAIN"
            staging="/var/www/$DEPLOY_USER/data/.site-staging/$DEPLOY_DOMAIN"
            backups="/var/www/$DEPLOY_USER/data/.site-backups/$DEPLOY_DOMAIN"
            test -f "$staging/next/index.html"
            mkdir -p "$backups"
            rm -rf -- "$backups/current" "$backups/older"
            mv "$site" "$backups/current"
            if ! mv "$staging/next" "$site"; then
              mv "$backups/current" "$site"
              exit 1
            fi
            if [ -d "$backups/previous" ]; then
              mv "$backups/previous" "$backups/older"
            fi
            mv "$backups/current" "$backups/previous"
            rm -rf -- "$backups/older"

      - name: Stop activation timer
        run: echo "ACTIVATION_FINISHED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Check published site
        run: bash .github/scripts/check-site.sh "https://$DEPLOY_DOMAIN/"

      - name: Report REG.RU time
        if: always()
        run: |
          if [[ -z "${DEPLOY_STARTED_MS:-}" ]]; then exit 0; fi
          elapsed_ms=$(( $(date +%s%3N) - DEPLOY_STARTED_MS ))
          printf '### REG.RU\n\nПубликация и healthcheck: %d.%03d с\n' \
            "$((elapsed_ms / 1000))" "$((elapsed_ms % 1000))" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${ACTIVATION_STARTED_MS:-}" && -n "${ACTIVATION_FINISHED_MS:-}" ]]; then
            activation_ms=$((ACTIVATION_FINISHED_MS - ACTIVATION_STARTED_MS))
            printf 'Замена сайта и сохранение бекапа: %d.%03d с\n' \
              "$((activation_ms / 1000))" "$((activation_ms % 1000))" >> "$GITHUB_STEP_SUMMARY"
          fi
