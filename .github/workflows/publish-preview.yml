name: Publish preview files

on:
  workflow_call:
    inputs:
      site_host:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DOMAIN: aleldm.online
      HEALTHCHECK_EXPECTED_TEXT: ${{ vars.HEALTHCHECK_EXPECTED_TEXT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify preview branch still exists
        run: git ls-remote --exit-code --refs origin "refs/heads/$GITHUB_REF_NAME" > /dev/null

      - name: Download built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-files
          path: site

      - name: Copy site via rsync
        uses: burnett01/rsync-deployments@155b6d6c1219ab2224c20c58d423a3f1b850395f # 9.0.1
        with:
          switches: -rtz
          path: site/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
          remote_path: "/var/www/${{ secrets.DEPLOY_USER }}/data/www/${{ inputs.site_host }}/"

      - name: Check published site
        env:
          SITE_URL: https://${{ inputs.site_host }}/
        run: |
          bash .github/scripts/check-site.sh "$SITE_URL"
          printf 'Published site: <%s>\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
