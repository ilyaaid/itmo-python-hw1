name: Publish preview files

on:
  workflow_call:
    inputs:
      site_host:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DOMAIN: aleldm.online
      HEALTHCHECK_EXPECTED_TEXT: ${{ vars.HEALTHCHECK_EXPECTED_TEXT }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify preview branch still exists
        run: git ls-remote --exit-code --refs origin "refs/heads/$GITHUB_REF_NAME" > /dev/null

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-files
          path: site

      - name: Copy site via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          source: "site/**"
          target: "/var/www/${{ secrets.DEPLOY_USER }}/data/www/${{ inputs.site_host }}"
          strip_components: 1

      - name: Check published site
        env:
          SITE_URL: https://${{ inputs.site_host }}/
        run: |
          bash .github/scripts/check-site.sh "$SITE_URL"
          printf 'Published site: <%s>\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
